<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard - TaskFlow</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body onload="fetchTasks()">

  <div class="dashboard-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <h1 class="sidebar-logo">
        TaskFlow
      </h1>

      <button onclick="logout()">
        Logout
      </button>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="dashboard-main">

      <div class="dashboard-header">

        <h1>
          Task Dashboard
        </h1>

        <p>
          Manage priorities and stay productive.
        </p>

      </div>


      <!-- TASK FORM -->

      <div class="task-form">

        <input
          type="text"
          id="title"
          placeholder="Task Title"
        />

        <input
          type="text"
          id="description"
          placeholder="Task Description"
        />

        <select id="priority">

          <option value="High">
            High Priority
          </option>

          <option value="Medium">
            Medium Priority
          </option>

          <option value="Low">
            Low Priority
          </option>

        </select>

        <button onclick="addTask()">
          Add Task
        </button>

      </div>


      <!-- TASK LIST -->

      <div
        id="taskContainer"
        class="task-grid"
      >
      </div>

    </main>

  </div>

  <script src="script.js"></script>

</body>

</html>
